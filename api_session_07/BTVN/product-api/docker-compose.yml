services:
  db:
    image: postgres:16-alpine
    container_name: product_api_db
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: devpw
      POSTGRES_DB: appdb
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d appdb"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - pgdata:/var/lib/postgresql/data

  api:
    build: .
    container_name: product_api_app
    environment:
      DB_URL: postgresql+psycopg2://app:devpw@db:5432/appdb
      FLASK_APP: wsgi.py
      SECRET_KEY: dev-secret-key
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "5000:5000"

volumes:
  pgdata:
