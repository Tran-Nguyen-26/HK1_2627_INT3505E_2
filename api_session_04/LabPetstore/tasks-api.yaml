openapi: 3.0.3

info:
  title: Pet Store API
  description: API quản lý thú cưng
  version: 1.0.0

servers:
  - url: https://api.example.com/v1

tags:
  - name: Pets
    description: Quản lý thú cưng

paths:

  /pets:
    get:
      tags:
        - Pets

      summary: Lấy danh sách thú cưng

      operationId: listPets

      parameters:
        - name: limit
          in: query
          description: Số lượng thú cưng tối đa trả về
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20

      responses:
        '200':
          description: Danh sách thú cưng
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PetList'

        '400':
          description: Request không hợp lệ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

        '500':
          description: Lỗi server
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    post:
      tags:
        - Pets

      summary: Tạo thú cưng mới

      operationId: createPet

      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Pet'

      responses:
        '201':
          description: Tạo thú cưng thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pet'

        '400':
          description: Dữ liệu không hợp lệ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

        '500':
          description: Lỗi server
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'


  /pets/{petId}:

    get:
      tags:
        - Pets

      summary: Lấy thông tin một thú cưng

      operationId: getPetById

      parameters:
        - name: petId
          in: path
          description: ID của thú cưng
          required: true
          schema:
            type: integer
            format: int64

      responses:
        '200':
          description: Thông tin thú cưng
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pet'

        '404':
          description: Không tìm thấy thú cưng
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

        '500':
          description: Lỗi server
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'


    put:
      tags:
        - Pets

      summary: Cập nhật thú cưng

      operationId: updatePet

      parameters:
        - name: petId
          in: path
          description: ID của thú cưng
          required: true
          schema:
            type: integer
            format: int64

      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Pet'

      responses:
        '200':
          description: Cập nhật thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pet'

        '400':
          description: Dữ liệu không hợp lệ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

        '404':
          description: Không tìm thấy thú cưng
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

        '500':
          description: Lỗi server
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'


    delete:
      tags:
        - Pets

      summary: Xóa thú cưng

      operationId: deletePet

      parameters:
        - name: petId
          in: path
          description: ID của thú cưng
          required: true
          schema:
            type: integer
            format: int64

      responses:
        '204':
          description: Xóa thú cưng thành công

        '404':
          description: Không tìm thấy thú cưng
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

        '500':
          description: Lỗi server
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'


components:

  schemas:

    Pet:
      type: object
      required:
        - id
        - name

      properties:
        id:
          type: integer
          format: int64
          example: 1

        name:
          type: string
          example: "Lucky"

        tag:
          type: string
          example: "dog"


    PetList:
      type: array
      items:
        $ref: '#/components/schemas/Pet'


    Error:
      type: object
      required:
        - code
        - message

      properties:
        code:
          type: integer
          example: 404

        message:
          type: string
          example: "Pet not found"


  securitySchemes:

    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT


security:
  - bearerAuth: []